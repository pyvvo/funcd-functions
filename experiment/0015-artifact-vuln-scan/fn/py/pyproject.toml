[project]
name = "exp-0015-fetch"
version = "1.0.0"
description = "The Python function of experiment 0015: fetch imports four dependencies locked at old releases with published advisories, one of them a native wheel."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.14"
# funcd-shim types the handler; the python314 runtime provides it, so funcd-bundle prunes it from the bundle.
dependencies = [
  "funcd-shim==0.18.0",
  "requests==2.25.1",
  "urllib3==1.26.4",
  "jinja2==3.1.2",
  "cryptography==41.0.0",
]

[dependency-groups]
dev = ["funcd-bundle==0.18.0"]

[tool.funcd-bundle.functions]
fetch = "src/fetch/main.py"
