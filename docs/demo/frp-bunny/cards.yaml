kind: Card
name: recap
layout: list
kicker: Recap
title: What we saw
items:
  - An admin registered two add-ons, and the App's egress names what it may reach
  - One App template holds an OpenTofu stack, a Tunnel, a Function and a Site
  - The stack applied OpenTofu's plan, its approval bypassed for the demo
  - Bunny served the page over HTTPS, through frps, frpc and funcd's edge
  - Deleting the App ran OpenTofu's destroy, which removed Bunny's side
