name: exp-0015-attest

# The attestation half of experiment 0015 in pyvvo/experiment, which keeps its source and results. On pyvvo's plan
# GitHub signs artifact attestations only in public repositories, so it runs on this branch of pyvvo/funcd-functions.
# scripts/attest-branch.sh in the experiment writes this branch; pushing it starts the run.
on:
  push:
    branches:
      - exp/0015-attestation

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      fetch_index: ${{ steps.produce.outputs.fetch_index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - id: produce
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop ./experiment/0015-artifact-vuln-scan#ci -c python3 experiment/0015-artifact-vuln-scan/attest/ci.py produce
      - name: Attest the SBOM of fetch for linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pyvvo/exp-0015-fetch
          subject-digest: ${{ steps.produce.outputs.fetch_amd64 }}
          sbom-path: experiment/0015-artifact-vuln-scan/out/fetch-amd64.cdx.json
          push-to-registry: true
      - name: Attest the SBOM of fetch for linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pyvvo/exp-0015-fetch
          subject-digest: ${{ steps.produce.outputs.fetch_arm64 }}
          sbom-path: experiment/0015-artifact-vuln-scan/out/fetch-arm64.cdx.json
          push-to-registry: true
      - name: Attest the SBOM of render
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pyvvo/exp-0015-render
          subject-digest: ${{ steps.produce.outputs.render }}
          sbom-path: experiment/0015-artifact-vuln-scan/out/render.cdx.json
          push-to-registry: true
      - name: Attest the provenance of fetch's index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pyvvo/exp-0015-fetch
          subject-digest: ${{ steps.produce.outputs.fetch_index }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the provenance of render
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pyvvo/exp-0015-render
          subject-digest: ${{ steps.produce.outputs.render }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: produce
          path: |
            experiment/0015-artifact-vuln-scan/out
            experiment/0015-artifact-vuln-scan/bin/funcdctl

  # The scan job's side: it reads what produce attached and needs no signing permission.
  consume:
    needs: produce
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: produce
          path: experiment/0015-artifact-vuln-scan
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop ./experiment/0015-artifact-vuln-scan#ci -c python3 experiment/0015-artifact-vuln-scan/attest/ci.py consume
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exp-0015-attest
          path: experiment/0015-artifact-vuln-scan/out/results-attest.json
