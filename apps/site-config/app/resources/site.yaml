sites:
  - name: ${{ app.name + "-web" }}
    image: ${{ images.web }}
    bucket:
      name: ${{ app.name + "-web" }}
    prefix: web
    spa: true
    ingress:
      host: ${{ values.host }}
      auth:
        mode: open
      baseHref: true
    runtimeConfig:
      values:
        API_URL: ${{ values.api.url }}
      configMap: ${{ app.name + "-flags" }}
