apiVersion: funcd.io/v1alpha1
kind: Site
metadata:
  name: site-config-preview
  namespace: staging
  resourceGroup: site-config
spec:
  image: oci-layout:///mnt/funcd-deps/registry/site-config-web:1.0.0
  buckets:
    - name: site-config-preview
  bindings:
    blob:
      - bucket: site-config-preview
        prefix: web
  spa: true
  ingress:
    path: /preview
    auth:
      mode: open
    baseHref: true
  runtimeConfig:
    values:
      API_URL: https://api.preview.example
