# The stack's runs (pyvvo/funcd-addons infrastack): the input is the action and the module's variables, the output its
# plain outputs, none required, since a destroy answers none.
runtime: opentofu1
input:
  type: object
  additionalProperties: false
  properties:
    action:
      type: string
      enum:
        - apply
        - destroy
    variables:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        region:
          type: string
        image_registry:
          type: integer
        frps_tag:
          type: string
        frps_digest:
          type: string
      required:
        - name
        - image_registry
        - frps_digest
  required:
    - action
    - variables
output:
  type: object
  additionalProperties: false
  properties:
    pullzone_host:
      type: string
