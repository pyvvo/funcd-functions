# The Secrets the App declares, applied before its deploy. frp-bunny-outputs gets the stack's sensitive output
# FRP_TOKEN, which the stack's Job writes, as the Secret's owner, at its apply, and the Tunnel reads; it holds the key,
# empty, until then. bunny-api holds Bunny's API key for the stack's Job: replace the value with the key in base64.
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: frp-bunny-outputs
  namespace: default
  resourceGroup: default
spec:
  owner:
    kind: Job
    name: frp-bunny-stack
  data:
    FRP_TOKEN: ""
---
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: bunny-api
  namespace: default
  resourceGroup: default
spec:
  data:
    BUNNYNET_API_KEY: <the API key in base64>
