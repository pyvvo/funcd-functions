# The daemon config of funcd's volumes lane: containerd, and a 64 MiB volume image at <dataDir>/volumes.img that every
# Function volume reserves its size from (funcd ADR-0262).
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd
  supervisionPeriod: 2s
volumes:
  capacityBytes: 67108864
log:
  format: text
  level: info
