# The daemon config of funcd's app-todo lane: containerd, and the durable Badger KV engine at <dataDir>/kv, so the
# App's data is on disk under /var/lib/funcd/data.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd
kvstore:
  engine: badger
log:
  format: text
  level: info
