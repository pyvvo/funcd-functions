# The daemon config of funcd's app-todo lane: containerd, and the durable Badger KV engine at <dataDir>/kv, so the
# App's data is on disk under /var/lib/funcd/data.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd
  # A replica silent on its liveness for 6 s is replaced, so the lane sees a hung API restarted within seconds
  # (funcd ADR-0215); the timeout is at least twice the supervision period.
  supervisionPeriod: 2s
  livenessTimeout: 6s
eventing:
  # The blob EventSource of the uploads lists its prefix every 2 s instead of 15 s.
  blobPollInterval: 2s
funclog:
  # A function's log lines reach funcdctl logs within 2 s instead of 10 s.
  segmentMaxAge: 2s
kvstore:
  engine: badger
log:
  format: text
  level: info
