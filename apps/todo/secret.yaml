# A test fixture, not a credential: the Secret that the todo App declares and never writes (funcd ADR-0213), which
# funcd's app-todo lane creates before it deploys the App. TODO_API_TOKEN is the base64 of todo-lane-token, a token
# that exists only in the lane.
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: todo-api-keys
  namespace: default
  resourceGroup: todo
spec:
  type: Opaque
  data:
    TODO_API_TOKEN: dG9kby1sYW5lLXRva2Vu
