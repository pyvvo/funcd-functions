name: todo
version: 1.0.0
registry: ${{ values.registry }}
images:
  api: todo-api:1.0.0
  migrate: todo-migrate:1.0.0
  warm: todo-warm:1.0.0
  planner: todo-planner:1.0.0
  collect: todo-collect:1.0.0
  rank: todo-rank:1.0.0
  intake: todo-intake:1.0.0
  stats: todo-stats:1.0.0
  web: todo-web:1.0.0
valuesSchema:
  type: object
  properties:
    registry:
      type: string
      default: registry.example
    greeting:
      type: string
      default: hello from the todo App
    schedule:
      type: object
      properties:
        cron:
          type: string
          default: "0 6 * * *"
        timeZone:
          type: string
          default: Asia/Kathmandu
    keptStores:
      type: boolean
      default: false
    shared:
      type: boolean
      default: false
    backup:
      type: boolean
      default: false
    backupTTL:
      type: string
      default: 24h
    store:
      type: string
      default: ""
    lake:
      type: boolean
      default: false
    sql:
      type: boolean
      default: false
when:
  resources/kept.yaml: ${{ values.keptStores !== true }}
  resources/kept-ref.yaml: ${{ values.keptStores === true }}
  resources/requires.yaml: ${{ values.shared === true }}
  resources/backup.yaml: ${{ values.backup === true }}
  resources/lake.yaml: ${{ values.lake === true }}
  resources/hooks-migrate.yaml: ${{ values.sql !== true }}
  resources/hooks-migrate-sql.yaml: ${{ values.sql === true }}
  resources/sql.yaml: ${{ values.sql === true }}
  # The parts of version 1.2.0 (app-1.2.0.yaml), which this version never renders.
  resources/api-1.2.yaml: ${{ false }}
  resources/intake-1.2.yaml: ${{ false }}
  resources/hooks-migrate-1.2.yaml: ${{ false }}
  resources/db-1.2.yaml: ${{ false }}
  resources/db-ref-1.2.yaml: ${{ false }}
  resources/feed-1.2.yaml: ${{ false }}
