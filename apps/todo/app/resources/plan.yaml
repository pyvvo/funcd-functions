workflows:
  - name: ${{ app.name + "-plan" }}
    kv:
      - name: ${{ app.name + "-plans" }}
        deletion: delete
        tables:
          - name: plans
            owner: rank
    steps:
      - name: collect
        function:
          image: ${{ images.collect }}
          blob:
            - alias: files
              bucket: ${{ app.name + "-files" }}
              prefix: attachments
      - name: rank
        function:
          image: ${{ images.rank }}
          kv:
            - alias: plans
              store: ${{ app.name + "-plans" }}
              table: plans
