functions:
  - name: ${{ app.name + "-warm" }}
    runtime: python314
    handler: handle
    image: ${{ images.warm }}
    bindings:
      kv:
        - alias: warm
          store: ${{ app.name + "-cache" }}
          table: warm
hooks:
  preApply:
    - function: ${{ app.name + "-migrate" }}
  postApply:
    - function: ${{ app.name + "-warm" }}
