# A fixture of funcd's app-todo lane (value lake): a Lake the App owns, so the App's backups copy it, and prefix docs
# beside it for Function todo-lake-sql (dr/lake-sql-of-app.yaml), through which the lane runs SQL on the Lake and writes
# a plain object.
buckets:
  - name: ${{ app.name + "-lakehouse" }}
    deletion: retain
    prefixes:
      - name: lake
        owner:
          kind: Lake
          name: ${{ app.name + "-lake" }}
      - name: docs
        owner:
          kind: Function
          name: ${{ app.name + "-lake-sql" }}
lakes:
  - name: ${{ app.name + "-lake" }}
    bindings:
      blob:
        - alias: lake
          bucket: ${{ app.name + "-lakehouse" }}
          prefix: lake
      secret:
        - ${{ app.name + "-lake-quack-token" }}
      config:
        - ${{ app.name + "-lake-engine" }}
    location:
      bucket: ${{ app.name + "-lakehouse" }}
      prefix: lake
    resources:
      cpu: "1"
      memory: 1Gi
secrets:
  - name: ${{ app.name + "-lake-quack-token" }}
    description: The Quack token of lake todo-lake; the lane creates this Secret (dr/lake-fixtures.yaml)
    keys:
      - QUACK_TOKEN
