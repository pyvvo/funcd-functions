# The value sql (funcd ADR-0236): SQLDatabase todo-db, whose schema the migrate hook keeps with Drizzle's migrations,
# and todo-stats, a SQLModel reader of it. The hook, its only writer, writes through the grant in grants.yaml.
configMaps:
  - name: ${{ app.name + "-sql" }}
    data:
      TODO_SQL: "on"
sql:
  - name: ${{ app.name + "-db" }}
functions:
  - name: ${{ app.name + "-stats" }}
    runtime: python314
    handler: handle
    image: ${{ images.stats }}
    bindings:
      sql:
        - alias: app
          database: ${{ app.name + "-db" }}
