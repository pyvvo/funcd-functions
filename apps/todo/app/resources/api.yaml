functions:
  - name: ${{ app.name + "-api" }}
    runtime: nodejs22
    handler: handle
    image: ${{ images.api }}
    kv:
      - alias: todos
        store: '${{ values.store !== "" ? values.store : app.name + "-store" }}'
        table: todos
      - alias: meta
        store: '${{ values.store !== "" ? values.store : app.name + "-store" }}'
        table: meta
      - alias: warm
        store: ${{ app.name + "-cache" }}
        table: warm
      - alias: uploads
        store: '${{ values.store !== "" ? values.store : app.name + "-store" }}'
        table: uploads
    blob:
      - alias: files
        bucket: ${{ app.name + "-files" }}
        prefix: attachments
      - alias: uploads
        bucket: ${{ app.name + "-files" }}
        prefix: uploads
      - alias: copies
        bucket: ${{ app.name + "-tmp" }}
        prefix: copies
    config:
      - ${{ app.name + "-settings" }}
    secrets:
      - ${{ app.name + "-api-keys" }}
