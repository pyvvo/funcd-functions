eventSources:
  - name: ${{ app.name + "-plan-timer" }}
    timer:
      events:
        - name: tick
          cron: ${{ values.schedule.cron }}
          timeZone: ${{ values.schedule.timeZone }}
sensors:
  - name: ${{ app.name + "-plan-schedule" }}
    "on":
      - name: tick
        source: ${{ app.name + "-plan-timer" }}
        event: tick
    do:
      - name: plan
        "on": tick
        workflow: ${{ app.name + "-plan" }}
        input:
          tick: ${{ event.time }}
