# A fixture of funcd's app-todo lane (value catalog): a DuckLake catalog the App owns, so the App's backups copy it.
buckets:
  - name: ${{ app.name + "-lakehouse" }}
    deletion: retain
    prefixes:
      - name: lake
        owner: ${{ app.name + "-lake" }}
catalogs:
  - name: ${{ app.name + "-lake" }}
    blob:
      - alias: lake
        bucket: ${{ app.name + "-lakehouse" }}
        prefix: lake
    catalog:
      bucket: ${{ app.name + "-lakehouse" }}
      prefix: lake
    resources:
      cpu: "1"
      memory: 1Gi
    secrets:
      - ${{ app.name + "-lake-quack-token" }}
    config:
      - ${{ app.name + "-lake-engine" }}
secrets:
  - name: ${{ app.name + "-lake-quack-token" }}
    description: The Quack token of catalog todo-lake; the lane creates this Secret (dr/catalog-fixtures.yaml)
    keys:
      - QUACK_TOKEN
