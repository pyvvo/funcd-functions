runtime: nodejs22
input:
  type: object
  additionalProperties: false
  properties:
    tick:
      type: string
  required:
    - tick
output:
  type: object
  additionalProperties: false
  properties:
    tick:
      type: string
    titles:
      type: array
      items:
        type: string
    collected_by:
      type: string
  required:
    - tick
    - titles
    - collected_by
