# The client config of the collect step (funcd ADR-0122): its output is the rank step's input.
runtime: nodejs22
handler: handle
bindings:
  blob:
    - alias: files
      bucket: todo-files
      prefix: attachments
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      tick:
        type: string
    required:
      - tick
  output:
    type: object
    additionalProperties: false
    properties:
      tick:
        type: string
      titles:
        type: array
        items:
          type: string
      collected_by:
        type: string
    required:
      - tick
      - titles
      - collected_by
