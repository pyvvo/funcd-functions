# The client config of the 1.1.0 pre-apply hook (funcd ADR-0122): its input is a hook call's (ADR-0214).
runtime: nodejs22
handler: handle
bindings:
  kv:
    - alias: todos
      store: todo-store
      table: todos
    - alias: meta
      store: todo-store
      table: meta
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      event:
        type: string
        enum:
          - install
          - upgrade
          - rollback
      app:
        type: string
      from:
        type: string
      to:
        type: string
      fromVersion:
        type: string
      toVersion:
        type: string
    required:
      - event
      - app
      - to
  output:
    type: object
    additionalProperties: false
    properties:
      migrated:
        type: integer
    required:
      - migrated
