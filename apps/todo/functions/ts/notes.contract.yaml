runtime: nodejs22
input:
  type: object
  additionalProperties: false
  properties:
    op:
      type: string
      enum:
        - init
        - add
        - list
        - batch
        - fill
        - size
    title:
      type: string
    titles:
      type: array
      items:
        type:
          - string
          - "null"
    megabytes:
      type: integer
      minimum: 1
  required:
    - op
output:
  type: object
  additionalProperties: false
  properties:
    notes:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: integer
          title:
            type: string
          done:
            type: integer
        required:
          - id
          - title
          - done
    added:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
      required:
        - id
        - title
    error:
      type: string
    blobs:
      type: integer
    bytes:
      type: integer
