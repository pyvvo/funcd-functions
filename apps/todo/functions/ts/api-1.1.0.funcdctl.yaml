# The client config of the 1.1.0 API (funcd ADR-0122): funcdctl push reads its runtime and contract.
runtime: nodejs22
handler: handle
bindings:
  kv:
    - alias: todos
      store: todo-store
      table: todos
    - alias: meta
      store: todo-store
      table: meta
    - alias: warm
      store: todo-cache
      table: warm
  blob:
    - alias: files
      bucket: todo-files
      prefix: attachments
    - alias: uploads
      bucket: todo-tmp
      prefix: uploads
  config:
    - todo-settings
  secrets:
    - todo-api-keys
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      op:
        type: string
        enum:
          - add
          - list
          - get
      title:
        type: string
      id:
        type: string
      token:
        type: string
    required:
      - op
  output:
    type: object
    additionalProperties: false
    properties:
      version:
        type: string
      id:
        type: string
      todos:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
            title:
              type: string
            done:
              type: boolean
          required:
            - id
            - title
            - done
      unmigrated:
        type: integer
      attachment:
        type:
          - string
          - "null"
      migration:
        type:
          - object
          - "null"
        additionalProperties: false
        properties:
          by:
            type: string
          event:
            type: string
          app:
            type: string
          from:
            type: string
          to:
            type: string
          fromVersion:
            type: string
          toVersion:
            type: string
          migrated:
            type: integer
        required:
          - by
          - event
          - app
          - to
          - migrated
      release:
        type:
          - object
          - "null"
        additionalProperties: false
        properties:
          by:
            type: string
          event:
            type: string
          revision:
            type: string
          version:
            type: string
        required:
          - by
          - event
          - revision
          - version
      greeting:
        type: string
      tokenSet:
        type: boolean
    required:
      - version
