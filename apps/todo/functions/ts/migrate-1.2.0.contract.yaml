runtime: nodejs22
input:
  type: object
  additionalProperties: false
  properties:
    event:
      type: string
      enum:
        - install
        - upgrade
        - rollback
    app:
      type: string
    from:
      type: string
    to:
      type: string
    fromVersion:
      type: string
    toVersion:
      type: string
  required:
    - event
    - app
    - to
output:
  type: object
  additionalProperties: false
  properties:
    migrated:
      type: integer
    uploads:
      type: integer
  required:
    - migrated
    - uploads
