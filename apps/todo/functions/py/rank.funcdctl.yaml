# The client config of the rank step (funcd ADR-0122): its input is the collect step's output.
runtime: python314
handler: handle
bindings:
  kv:
    - alias: plans
      store: todo-plans
      table: plans
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      tick:
        type: string
      titles:
        type: array
        items:
          type: string
      collected_by:
        type: string
    required:
      - tick
      - titles
      - collected_by
  output:
    type: object
    additionalProperties: false
    properties:
      tick:
        type: string
      count:
        type: integer
      ranked_by:
        type: string
    required:
      - tick
      - count
      - ranked_by
