# The client config of the notes_report Function (funcd ADR-0122): funcdctl push reads its runtime and contract.
runtime: python314
handler: handle
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      op:
        type: string
  output:
    type: object
    additionalProperties: false
    properties:
      titles:
        type: array
        items:
          type: string
      count:
        type: integer
      error:
        type: string
