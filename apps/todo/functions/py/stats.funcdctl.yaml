# The client config of the stats Function (funcd ADR-0122): funcdctl push reads its runtime and contract.
runtime: python314
handler: handle
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      op:
        type: string
  output:
    type: object
    additionalProperties: false
    properties:
      todos:
        type: integer
      migrations:
        type: integer
    required:
      - todos
      - migrations
