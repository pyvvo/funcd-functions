# The client config of the post-apply hook (funcd ADR-0122): its input is a hook call's (ADR-0214).
runtime: python314
handler: handle
bindings:
  kv:
    - alias: warm
      store: todo-cache
      table: warm
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      event:
        type: string
        enum:
          - install
          - upgrade
          - rollback
      app:
        type: string
      from:
        type: string
      to:
        type: string
      fromVersion:
        type: string
      toVersion:
        type: string
    required:
      - event
      - app
      - to
  output:
    type: object
    additionalProperties: false
    properties:
      revision:
        type: string
    required:
      - revision
