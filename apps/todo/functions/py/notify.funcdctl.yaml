# The client config of the change-feed consumer (funcd ADR-0122): its input is the data of a sql change event
# (funcd ADR-0235).
runtime: python314
handler: handle
bindings:
  kv:
    - alias: added
      store: todo-feed
      table: added
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      op:
        type: string
      table:
        type: string
      rowId:
        type: integer
      before: {}
      after: {}
      index:
        type: integer
      commitTimestamp:
        type: integer
      truncated:
        type: boolean
    required:
      - op
      - table
      - rowId
      - index
  output:
    type: object
    additionalProperties: false
    properties:
      slug:
        type: string
    required:
      - slug
