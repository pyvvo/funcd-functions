[project]
name = "funcd-functions-todo"
version = "1.0.0"
description = "The Python functions of the todo App: the planner, the rank step of its Workflow, its warm hook, the intake of its uploads, the stats reader of its value sql and the notes_report reader of the sql lane."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# funcd-shim types the handlers; at run time the python314 runtime provides it. notes_report's and stats' models need
# SQLModel, which funcd-bundle vendors for the sql lane.
dependencies = ["funcd-shim==0.9.0", "sqlalchemy==2.0.54", "sqlmodel==0.0.47"]

[dependency-groups]
dev = ["funcd-bundle==0.9.0", "mypy>=1.13", "ruff>=0.8"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["intake.py", "notes_report.py", "planner.py", "rank.py", "stats.py", "warm.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
