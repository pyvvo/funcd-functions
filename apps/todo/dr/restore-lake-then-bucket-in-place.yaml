# Lake todo-lake, then its Bucket todo-lakehouse, both in place from Backup todo-lakehouse-b1: the Bucket's Restore
# leaves the Lake's prefix, so the order does not matter (funcd ADR-0312 Decision 4).
apiVersion: funcd.io/v1alpha1
kind: Restore
metadata:
  name: todo-lake-bucket-back
  namespace: default
  resourceGroup: todo
spec:
  backup: todo-lakehouse-b1
  source:
    credentialsSecret: todo-backup-reader
    identitySecret: todo-backup-key
  members:
    - kind: Lake
      name: todo-lake
      inPlace: true
    - kind: Bucket
      name: todo-lakehouse
      inPlace: true
