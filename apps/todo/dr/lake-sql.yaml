# Function fill-lake-sql, the Quack client of lake-sql-of-app.yaml on another Lake fill-lake, which the lane fills in.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: fill-lake-sql
  namespace: default
  resourceGroup: todo
spec:
  runtime: python314
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry/todo-lake-sql:1.0.0
  lakes:
    - ref: fill-lake
  bindings:
    lake:
      - alias: lake
        lake: fill-lake
