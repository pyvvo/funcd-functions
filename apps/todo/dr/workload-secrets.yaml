# Test fixtures, not credentials: the Secrets of the todo App's own backups (funcd ADR-0222) in funcd's app-todo lane.
# todo-backup-writer and todo-backup-reader hold the S3 server's test key (versitygw.env); todo-backup-key holds the
# operator's identity of identity.txt, which opens the backups.
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: todo-backup-writer
  namespace: default
  resourceGroup: todo
spec:
  type: Opaque
  data:
    AWS_ACCESS_KEY_ID: dG9kby1sYW5lLXMz
    AWS_SECRET_ACCESS_KEY: dG9kby1sYW5lLXMzLXNlY3JldA==
---
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: todo-backup-reader
  namespace: default
  resourceGroup: todo
spec:
  type: Opaque
  data:
    AWS_ACCESS_KEY_ID: dG9kby1sYW5lLXMz
    AWS_SECRET_ACCESS_KEY: dG9kby1sYW5lLXMzLXNlY3JldA==
---
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: todo-backup-key
  namespace: default
  resourceGroup: todo
spec:
  type: Opaque
  data:
    AGE_IDENTITY: QUdFLVNFQ1JFVC1LRVktMVJDMDc4NU0wNkRaSjg0RzVNSFVNV1pUR0ZNVllRNDk0SjRERDVKOVg4TExTOVMwTDdFMlFKNzVTUTU=
