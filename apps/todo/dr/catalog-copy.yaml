# The CatalogService that serves the restored copy of catalog todo-lake (dr/restore-catalog.yaml).
apiVersion: funcd.io/v1alpha1
kind: CatalogService
metadata:
  name: todo-lake-r
  namespace: default
  resourceGroup: todo
spec:
  buckets:
    - ref: todo-lakehouse-r
  configMaps:
    - ref: todo-lake-engine
  secrets:
    - name: todo-lake-quack-token
      keys:
        - QUACK_TOKEN
  bindings:
    blob:
      - alias: lake
        bucket: todo-lakehouse-r
        prefix: lake
    secret:
      - todo-lake-quack-token
    config:
      - todo-lake-engine
  catalog:
    bucket: todo-lakehouse-r
    prefix: lake
  resources:
    cpu: "1"
    memory: 1Gi
