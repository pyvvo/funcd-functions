# The daemon config of the last case of the disaster-recovery block of funcd's app-todo lane: funcdconfig.yaml with the
# blob store itself on the S3 server in the VM, in a versioned bucket (funcd ADR-0208), instead of the local directory.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/admin
      role: admin
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
      namespaces:
        - default
runtime:
  mode: containerd
  supervisionPeriod: 2s
  livenessTimeout: 6s
eventing:
  blobPollInterval: 2s
funclog:
  segmentMaxAge: 2s
blob:
  target: s3://todo-blob?endpoint=http://127.0.0.1:7070&region=us-east-1&use_path_style=true
  credentialsFile: /opt/lane/dr/backup.credentials
  versionRetention: 24h
kvstore:
  engine: badger
  backup:
    enabled: true
    interval: 10s
backup:
  target: s3://todo-backup?endpoint=http://127.0.0.1:7070&region=us-east-1&use_path_style=true
  credentialsFile: /opt/lane/dr/backup.credentials
  interval: 20s
  encryption:
    recipients:
      - /opt/lane/dr/recipients.txt
log:
  format: text
  level: info
