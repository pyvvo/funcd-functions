# A Lake fill-lake on prefix fill-prefix of Bucket fill-bucket, which the lane fills in, with the engine settings and
# the Quack token of lake-fixtures.yaml.
apiVersion: funcd.io/v1alpha1
kind: Lake
metadata:
  name: fill-lake
  namespace: default
  resourceGroup: todo
spec:
  buckets:
    - ref: fill-bucket
  configMaps:
    - ref: todo-lake-engine
  secrets:
    - name: todo-lake-quack-token
      keys:
        - QUACK_TOKEN
  bindings:
    blob:
      - alias: lake
        bucket: fill-bucket
        prefix: fill-prefix
    secret:
      - todo-lake-quack-token
    config:
      - todo-lake-engine
  location:
    bucket: fill-bucket
    prefix: fill-prefix
  resources:
    cpu: "1"
    memory: 1Gi
