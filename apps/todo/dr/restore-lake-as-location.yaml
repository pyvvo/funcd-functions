# Restore fill-name of Lake fill-lake into prefix fill-prefix of Bucket fill-bucket from Backup BACKUP, which the lane
# fills in (funcd ADR-0222 Decision 7).
apiVersion: funcd.io/v1alpha1
kind: Restore
metadata:
  name: fill-name
  namespace: default
  resourceGroup: todo
spec:
  backup: BACKUP
  source:
    credentialsSecret: todo-backup-reader
    identitySecret: todo-backup-key
  members:
    - kind: Lake
      name: fill-lake
      asLocation:
        bucket: fill-bucket
        prefix: fill-prefix
