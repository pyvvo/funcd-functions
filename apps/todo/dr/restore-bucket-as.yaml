# Restore fill-name of Bucket fill-bucket as Bucket fill-target from Backup BACKUP, which the lane fills in. It carries
# no Lake and leaves fill-target's Lakes (funcd ADR-0312 Decision 4).
apiVersion: funcd.io/v1alpha1
kind: Restore
metadata:
  name: fill-name
  namespace: default
  resourceGroup: todo
spec:
  backup: BACKUP
  source:
    credentialsSecret: todo-backup-reader
    identitySecret: todo-backup-key
  members:
    - kind: Bucket
      name: fill-bucket
      as: fill-target
