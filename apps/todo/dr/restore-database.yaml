# From version 1.2.0, todo-db restored under a new name from Backup BACKUP, which the lane substitutes (funcd ADR-0234):
# an empty SQLDatabase todo-db-r that the API owns, the grants of its other writers, and the Restore that fills it.
apiVersion: funcd.io/v1alpha1
kind: SQLDatabase
metadata:
  name: todo-db-r
  namespace: default
  resourceGroup: todo
spec:
  owner: todo-api
---
apiVersion: funcd.io/v1alpha1
kind: RolesAssignment
metadata:
  name: todo-writers-db-r
  namespace: default
  resourceGroup: todo
spec:
  assignments:
    - principal:
        kind: Function
        name: todo-migrate
      roleRef:
        kind: BuiltinRole
        name: SQL Data Writer
      scope:
        kind: SQLDatabase
        name: todo-db-r
    - principal:
        kind: Function
        name: todo-intake
      roleRef:
        kind: BuiltinRole
        name: SQL Data Writer
      scope:
        kind: SQLDatabase
        name: todo-db-r
---
apiVersion: funcd.io/v1alpha1
kind: Restore
metadata:
  name: todo-db-copy
  namespace: default
  resourceGroup: todo
spec:
  backup: BACKUP
  source:
    credentialsSecret: todo-backup-reader
    identitySecret: todo-backup-key
  members:
    - kind: SQLDatabase
      name: todo-db
      as: todo-db-r
