# The workload backup of notes-db in funcd's sql lane (funcd ADR-0234), to the S3 server the lane runs in its VM, with
# the todo App's test Secrets of dr/workload-secrets.yaml and sealed to the lane's recipients (dr/recipients.txt). The
# lane creates its Backups by hand, so the slot is far off.
apiVersion: funcd.io/v1alpha1
kind: BackupSchedule
metadata:
  name: notes-backup
  namespace: default
  resourceGroup: notes
spec:
  schedule: "0 3 * * *"
  timeZone: UTC
  scope:
    databases:
      - notes-db
  target:
    url: s3://todo-workload?endpoint=http://127.0.0.1:7070&region=us-east-1&use_path_style=true
    credentialsSecret: todo-backup-writer
  encryption:
    recipients:
      - age1gvngj00ucwlleuk898r0s3umcacr5mxhkv4fy67evygxsmlgpanq43ttm3
      - age1263g0rath75xcgy9wh9cd6p9tpdn6wq35t5fa5pajnna4u7tgyhsxd384c
