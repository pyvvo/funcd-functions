# The notes function bound to notes-db-restored once its Restore succeeded, to read the copy.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: notes-restored
  namespace: default
  resourceGroup: notes
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:notes
  sql:
    - alias: app
      database: notes-db-restored
