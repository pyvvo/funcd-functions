# The daemon config of funcd's sql lane: containerd with file storage, so each SQL engine keeps its data in a durable
# directory under /var/lib/funcd/data (funcd ADR-0231), and static credentials, since an in-place Restore needs an
# admin (funcd ADR-0222).
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  credentials:
    - tokenFile: /etc/funcd/tokens/admin
      role: admin
    - tokenFile: /etc/funcd/tokens/developer
      role: developer
      namespaces:
        - default
catalog:
  # The bridge gateway, where the engines post their changes (funcd ADR-0235), reachable from their netns.
  proxyHost: 10.63.0.1
runtime:
  mode: containerd
  supervisionPeriod: 2s
log:
  format: text
  level: info
